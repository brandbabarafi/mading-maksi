# Publikasikan folder public/ ke GitHub Pages setiap ada push ke main.
# Alamat API diambil dari variabel repo API_BASE (Settings → Secrets and variables → Actions → Variables).
name: Publish ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Tulis alamat API
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::Variabel repo API_BASE belum diisi; halaman tidak bisa memuat data."
          fi
          printf "export const API_BASE = '%s';\n" "$API_BASE" > public/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
